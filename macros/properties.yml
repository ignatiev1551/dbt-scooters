version: 2

macros:
  - name: "updated_at"
    description: "Columns which represent timestamp of the last update"
  - name: "date_in_moscow"
    description: "Casting timestamptz to date in MSK zone"
    arguments:
      - name: "ts_col"
        type: "string"
        description: "Timestamp column in timestamptz format"
  - name: "trips_geom_stat"
    description: "Count trips per hexagon of given size"
    arguments:
      - name: "trips_table"
        type: "string"
        description: "Base model with the source data"
      - name: "geom_col"
        type: "string"
        description: "Name of the column with geometry from the source data"
      - name: "grid"
        type: "integer"
        description: "Size of the hexagon"
  - name: "create_role"
    description: "Create role for users as dbt operation"
    arguments:
      - name: "name"
        type: "string"
        description: "Role name"
  - name: "trips_age_sex_report"
    description: "Compute trips statistics in time by age and gender of user"
    arguments:
      - name: "trips_table"
        type: "string"
        description: "Table with source trips data enriched with user data"
      - name: "granularity"
        type: "string"
        description: "Time granularity for report (daily/weekly/monthly)"