version: 2

models: 
  - name: "revenue_daily"
    description: "Daily revenue from scooters trips"
    config:
      materialized: "incremental"
      strategy: "merge"
      unique_key: ["date"]
      on_schema_change: append_new_columns
      full_refresh: false
      contract:
        enforced: true
    columns:
      - name: "revenue_rub"
        description: "Daily revenue in rubels on the definite date"
        data_type: "decimal(20,2)"
      - name: "date"
        description: "Date"
        data_type: "date"
      - name: "Updated_at"
        description: "The date of the revenue's daily calculation"
        data_type: "timestamptz"
  - name: "revenue_users_monthly"
    description: "Monthly revenue by user"
    data_tests:
      - unique_key:
           columns: ["user_id", "month"]
  - name: "revenue_monthly"
    description: "Monthly revenue from scooter's trips"   
    data_tests:
      - unique_key:
          columns: ["month"]
      - dbt_utils.expression_is_true:
         expression: "users>=1000 and revenue_median>=500"
  - name: "revenue_monthly_report"
    description: "Monthly revenue report"
    config:
      materialized: "incremental"
      strategy: "append"
      on_schema_change: "append_new_columns"
      full_refresh: false
    data_tests:
      - unique_key:
         columns: [ "month" ]
    
exposures:
  - name: "financial_dashboard"
    label: "Financial Dashboard"
    type: "dashboard"
    maturity: "high"
    description: "Main financial dashboard on company with code financial metrics"
    depends_on:
      - "ref('revenue_daily')"
    owner:
      name: "Finance department"