version: 2

models: 
  - name: "revenue_daily"
    description: "Daily revenue from scooters trips"
    config:
      materialized: "incremental"
      strategy: "merge"
      unique_key: ["date"]
      on_schema_change: append_new_columns
      full_refresh: false
      contract:
        enforced: true
    columns:
      - name: "revenue_rub"
        description: "Daily revenue in rubels on the definite date"
        data_type: "decimal(20,2)"
      - name: "date"
        description: "Date"
        data_type: "date"
      - name: "Updated_at"
        description: "The date of the revenue's daily calculation"
        data_type: "timestamptz"
  
exposures:
  - name: "financial_dashboard"
    label: "Financial Dashboard"
    type: "dashboard"
    maturity: "high"
    description: "Main financial dashboard on company with code financial metrics"
    depends_on:
      - "ref('revenue_daily')"
    owner:
      name: "Finance department"