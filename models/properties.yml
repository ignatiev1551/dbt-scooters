version: 2
sources:
  - name: "scooters_raw"
    description: "Raw data provided by scooters service"
    loader: "https://t.me/inzhenerka_dbt_bot"
    
    tables:
      - name: "trips"
        description: "Scooter trips"
        freshness: 
         error_after:
          count: 730
          period: day
         warn_after:
          count: 1
          period: day
        loaded_at_field: "finished_at at time zone 'UTC'"
        columns:
          - name: "user_id"
            description: "User's identificator"
            tests:
              - relationships:
                  name: "every_trip_has_user"
                  to: source ('scooters_raw','users')
                  field: "id"
              - not_null
                  
      - name: "users"
        description: "Users of scooter service"
        columns:
          - name: "sex"
            description: "User gender"
            tests:
              - accepted_values:
                  values: ["M", "F"]
              - not_null:
                  config:
                    severity: "warn"
    
      - name: "events"
        description: "Event of scooter's trips"
models:
  - name: "trips_prep"
    description: "Prepered trips for next analyzing"
    config:
      materialized: "view"
    tests:
      - row_count_same:
          compare_model: "source('scooters_raw', 'trips')"
  - name: "users_prep"
    description: "Prepared users for next analyzing"
    config:
      materialized: "view"

  - name: "trips_stat"
    description: "General trips' statistics"
  - name: "trips_stat_daily"
    description: "Daily trips statistics"
    +indexes:
      - columns: ["date"]
  - name: "trips_age_daily"
    description: "Daily trips statistics by user age"
    tests:
      - unique:
          column_name: "date::text || age::text"
      - unique_key:
          columns: ["date", "age"]
  - name: "trips_age_daily_stat"
    description: "Aggregation of daily trips statistics by user age"
  - name: "trips_geom"
    description: "Trips prepared for parking statistics"
    config:
      materialized: "view"
  - name: "trips_start_stat"
    description: "Parking statistics for start by 500 m hexagons"
  - name: "trips_finish_stat"
    description: "Parking statistics for finish by 10 m hexagons"
  - name: "trips_users"
    description: "General trips statistics with sex and age of user"
    config:
      materialized: "incremental"
      post_hook:
        - "analyze dbt.trips_users" 
        - sql: "vacuum dbt.trips_users"
          transaction: false
  - name: "events_clean"
    description: "User events without duplicates"
    config:
      materialized: "incremental"
      strategy: "merge"
      unique_key: ["user_id","timestamp","type_id"]
  - name: "trips_concurrency"
    description: "Concurrent trips"
    config:
      materialized: "incremental"
  - name: "companies"
    description: "Aggregate model of scooter's companies"
  - name: "companies_trips"
    description: "Statistics of using scooters by thier company"
    columns:
      - name: "company"
        description: "Scooter's manufactures"
        tests:
          - unique
  - name: "events_full"
    description: "User events enriched with meaningful types"
    config:
      materialized: "view"
  - name: "events_stream"
    description: "User events prepered for product analysis"
    config:
      materialized: "ephemeral"
  - name: "events_stat"
    description: "Statistics of canceled trips"
  - name: "trips_age_group"
    description: "Statistics of trips by spliting on age groups"
  - name: "sex_age_pivot"
    description: "The pivot table an user sex depending of age"
    columns:
      - name: "age"
        description: "User age"
        tests:
          - dbt_utils.not_constant
    tests:
      - unique_key:
          columns: ["age"]
      - dbt_expectations.expect_table_column_count_to_equal:
          value: 3
  - name: "book_scooter_retention"
    description: >
                  A retention analysis, which tells how many people who did to start search a scooter booked it
                  on or after 1, 7, 14 days (or weeks, months, years), etc
  
  - name: "users_class_weekly_trips"
    description: >
                  A classification of users by completed trips per week
    columns:
      - name: "user_id"
        description: "User's identificator"
      - name: "fan"
        description: "User uses scooter's service more than 6 times per week"
      - name: "regular"
        description: "User uses scooter's service more than 3 times per week"
    tests:
      - unique_key:
          columns: ["user_id"]
  - name: "users_class_weekly_destination_trips"
    description: >
                  A data's preparation for users' classification by morning trips 
                  to the same place during a week
    columns:
    - name: "user_id"
      description: "User's identificator"
    - name: "to_work"
      description: "The indication of using scooters for trips to work"
    tests:
      - unique_key:
          columns: ["user_id"]
  - name: "users_class_monthly_trips"
    description: "Users' classification by trips which was done during a month"
    columns:
    - name: "user_id"
      description: "User's identificator"
    - name: "rare"
      description: "The indicator of rare using scooters during a month (less than 2 times a month)"
    data_tests:
      - unique_key:
          columns: ["user_id"]
  - name: "users_class"
    description: "Users' classification by using scooters' service"
    data_tests:
      - unique_key:
          columns: ["user_id"]
  - name: "users_class_stat"
    description: >
                  An overall group statistis of using service with a number of users in each group
  - name: "trips_age_sex_daily"
    description: "Daily statistics of trips aggregated by age and sex"
    data_tests:
      - unique_key:
          columns: ["date", "age", "sex"]
  - name: "trips_age_sex_weekly"
    description: "Weekly statistics of trips aggregated by age and sex"
    data_tests:
      - unique_key:
          columns: ["week", "age", "sex"]
  - name: "trips_age_sex_monthly"
    description: "Monthly statistics of trips aggregated by age and sex"
    data_tests:
      - unique_key:
          columns: ["month", "age", "sex"]
  - name: "first_name_sex"
    description: "Filling user's missing sex from available information"
    data_tests:
      - row_count_same:
          compare_model: "source('scooters_raw', 'users')"
  - name: "users_full"
    description: "Filled missings in user's sex"
    data_tests:
       - row_count_same:
           compare_model: "source('scooters_raw', 'users')"
    columns:
       - name: "sex"
         description: "User gender"
         data_tests:
              - accepted_values:
                  values: ["M", "F"]
              - not_null