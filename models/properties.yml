version: 2
sources:
  - name: "scooters_raw"
    description: "Raw data provided by scooters service"
    loader: "https://t.me/inzhenerka_dbt_bot"
    
    tables:
      - name: "trips"
        description: "Scooter trips"
        freshness: 
         error_after:
          count: 730
          period: day
         warn_after:
          count: 1
          period: day
        loaded_at_field: "finished_at at time zone 'UTC'"
        columns:
          - name: "user_id"
            description: "User's identificator"
            tests:
              - relationships:
                  name: "every_trip_has_user"
                  to: source ('scooters_raw','users')
                  field: "id"
              - not_null
                  
      - name: "users"
        description: "Users of scooter service"
        columns:
          - name: "sex"
            description: "User gender"
            tests:
              - accepted_values:
                  values: ["M", "F"]
              - not_null:
                  config:
                    severity: "warn"
    
      - name: "events"
        description: "Event of scooter's trips"
models:
  - name: "trips_prep"
    description: "Prepered trips for next analyzing"
    config:
      materialized: "view"
  - name: "trips_stat"
    description: "General trips' statistics"
  - name: "trips_stat_daily"
    description: "Daily trips statistics"
    +indexes:
      - columns: ["date"]
  - name: "trips_age_daily"
    description: "Daily trips statistics by user age"
    tests:
      - unique:
          column_name: "date::text || age::text"
      - unique_key:
          columns: ["date", "age"]
  - name: "trips_age_daily_stat"
    description: "Aggregation of daily trips statistics by user age"
  - name: "trips_geom"
    description: "Trips prepared for parking statistics"
    config:
      materialized: "view"
  - name: "trips_start_stat"
    description: "Parking statistics for start by 500 m hexagons"
  - name: "trips_finish_stat"
    description: "Parking statistics for finish by 10 m hexagons"
  - name: "trips_users"
    description: "General trips statistics with sex and age of user"
    config:
      materialized: "incremental"
      post_hook:
        - "analyze dbt.trips_users" 
        - sql: "vacuum dbt.trips_users"
          transaction: false
  - name: "events_clean"
    description: "User events without duplicates"
    config:
      materialized: "incremental"
      strategy: "merge"
      unique_key: ["user_id","timestamp","type_id"]
  - name: "trips_concurrency"
    description: "Concurrent trips"
    config:
      materialized: "incremental"
  - name: "companies"
    description: "Aggregate model of scooter's companies"
  - name: "companies_trips"
    description: "Statistics of using scooters by thier company"
    columns:
      - name: "company"
        description: "Scooter's manufactures"
        tests:
          - unique
  - name: "events_full"
    description: "User events enriched with meaningful types"
    config:
      materialized: "view"
  - name: "events_stat"
    description: "Statistics of canceled trips"
  - name: "trips_age_group"
    description: "Statistics of trips by spliting on age groups"
  - name: "sex_age_pivot"
    description: "The pivot table an user sex depending of age"
    columns:
      - name: "age"
        description: "User age"
        tests:
          - dbt_utils.not_constant
    test:
      - unique_key:
          columns: ["age"]